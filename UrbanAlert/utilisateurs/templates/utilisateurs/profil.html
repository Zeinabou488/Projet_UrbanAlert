{% extends 'base.html' %}

{% block title %}Mon profil — UrbanAlert{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <h2 class="fw-bold mb-4">
                <i class="fas fa-user-edit text-success me-2"></i>Mon profil
            </h2>

            <div class="card border-0 shadow-sm mb-3">
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                            <div class="text-danger small">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                        {% endfor %}
                        <button type="submit" class="btn btn-ua-primary w-100">
                            <i class="fas fa-save me-1"></i>Enregistrer les modifications
                        </button>
                    </form>
                </div>
            </div>

            <div class="text-center">
                <a href="{% url 'changer_mot_de_passe' %}" class="btn btn-outline-secondary">
                    <i class="fas fa-key me-1"></i>Changer mon mot de passe
                </a>
                &nbsp;
                <a href="{% url 'mes_signalements' %}" class="btn btn-outline-success">
                    <i class="fas fa-list me-1"></i>Mes signalements
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
