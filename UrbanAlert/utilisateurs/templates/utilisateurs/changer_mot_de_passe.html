{% extends 'base.html' %}

{% block title %}Changer le mot de passe — UrbanAlert{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-header fw-bold">
                    <i class="fas fa-key me-2 text-success"></i>Changer le mot de passe
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ field.label }}</label>
                            <input type="password" name="{{ field.html_name }}"
                                   class="form-control" required>
                            {% if field.errors %}
                            <div class="text-danger small">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                        {% endfor %}
                        <button type="submit" class="btn btn-ua-primary w-100">
                            <i class="fas fa-save me-1"></i>Modifier le mot de passe
                        </button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{% url 'profil' %}">← Retour au profil</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
